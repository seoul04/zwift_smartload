[dongle]
serial = "/dev/ttyACM0"
#serial = "/tmp/ttyV0"

[buffer]
max_minutes = 60

[dircon]
# Wahoo DirCon (Direct Connect) server: lets Zwift pair over the LAN instead of via Zwift Companion.
# Zwift discovers it through mDNS, so the server and the Zwift container need host networking.
enabled = true
# One device (trainer + power + heart rate) advertised under the dongle's own name and
# Bluetooth address, as reported by the dongle ({"cmd":"info"}).
port = 36866
# Override the name / MAC the dongle reports (names must be unique on the LAN)
# name = "Z-Relay-3ED5"
# mac_address = "AA:BB:CC:DD:EE:FF"
# Seconds to wait for the dongle's name before advertising as "Z-Relay" with this machine's MAC
identity_timeout_s = 15
# Ask the dongle for its name over serial. Leave false unless the firmware reads
# serial input (dongle/src/serial_cmd.c): firmware without it never drains what
# is written, and the backed-up USB endpoint silences ALL sensor data while the
# port still looks connected. See README "Troubleshooting".
probe_identity = false
# Interface to bind and advertise; auto-detected (default route) when omitted
# bind_ip = "192.168.1.10"
# Seconds without dongle data before values drop to zero
stale_timeout_s = 3
notify_interval_s = 1.0
# Send Zwift's FTMS control point commands (grade, ERG, ...) to the trainer through the dongle.
# Requires dongle firmware with serial command input (serial_cmd.c); when false, commands are
# only acknowledged and the trainer resistance does not follow Zwift.
forward_control = true
# Seconds to wait for the trainer's answer before reporting failure to Zwift
control_timeout_s = 2.0
# Only push notifications for characteristics the client subscribed to
notify_subscribed_only = true
# Log every DirCon frame at DEBUG level
log_frames = false

[frontend]
update_interval_ms = 500

[logging]
# Log file path for raw serial port data
# Leave empty or omit to disable logging
# Example: log_file = "/var/log/zwift/serial_data.log"
log_file = "/home/christian/temp/zwift_serial.log"

# Metrics Configuration
# Each metric can be configured with the following options:
#
# display_name: Name shown in the UI (current values and chart legend)
# internal_name: Internal identifier (must match the metric name in the code)
# unit: Unit of measurement (e.g., "bpm", "W", "rpm", "km/h", "%", or "" for unitless)
# show_in_current_values: true/false - whether to show in the current values panel
# show_in_plot: true/false - whether to show in the chart plot
# color: Color for the metric line and indicator dot
#        - Can use hex codes: "#f44336", "#2196F3", etc.
#        - Can use CSS color names: "red", "blue", "navy", "orange", "darkgreen", etc.
# line_width: Width of the line in pixels (default: 2)
# line_style: Style of the line (default: "solid")
#            Options: "solid", "dash", "dot", "dashdot", "longdash", "longdashdot"
# yaxis: Which y-axis to use ("y", "y2", "y3", etc.)
#        Multiple metrics can share the same y-axis (e.g., power metrics on y2)
# yaxis_range: Optional fixed range [min, max] for the y-axis
#             If not specified, the axis will auto-scale based on data

[metrics.heart_rate]
display_name = "Heart Rate"
internal_name = "heart_rate"
unit = "bpm"
show_in_current_values = true
show_in_plot = true
color = "crimson"
line_width = 2
line_style = "solid"
yaxis = "y"
yaxis_range = [60, 180]

[metrics.power_meter_power]
display_name = "Power Meter Power"
internal_name = "power_meter_power"
unit = "W"
show_in_current_values = true
show_in_plot = true
color = "dodgerblue"
line_width = 2
line_style = "solid"
yaxis = "y2"
yaxis_range = [0, 500]

[metrics.power_meter_cadence]
display_name = "Power Meter Cadence"
internal_name = "power_meter_cadence"
unit = "rpm"
show_in_current_values = true
show_in_plot = true
color = "orange"
line_width = 2
line_style = "solid"
yaxis = "y3"
yaxis_range = [0, 100]

[metrics.trainer_speed]
display_name = "Trainer Speed"
internal_name = "trainer_speed"
unit = "m/h"
show_in_current_values = true
show_in_plot = true
color = "blueviolet"
line_width = 2
line_style = "solid"
yaxis = "y4"
yaxis_range = [0, 4000]

[metrics.trainer_power]
display_name = "Trainer Power"
internal_name = "trainer_power"
unit = "W"
show_in_current_values = true
show_in_plot = true
color = "skyblue"
line_width = 1
line_style = "solid"
yaxis = "y2"
yaxis_range = [0, 500]

[metrics.trainer_cadence]
display_name = "Trainer Cadence"
internal_name = "trainer_cadence"
unit = "rpm"
show_in_current_values = true
show_in_plot = true
color = "cyan"
line_width = 2
line_style = "solid"
yaxis = "y3"
yaxis_range = [0, 100]

[metrics.sim_grade]
display_name = "Grade"
internal_name = "sim_grade"
unit = "%"
show_in_current_values = true
show_in_plot = true
color = "orangered"
line_width = 2
line_style = "dot"
yaxis = "y6"
yaxis_range = [-1000, 1000]

[metrics.sim_resistance]
display_name = "Resistance"
internal_name = "sim_resistance"
unit = "%"
show_in_current_values = true
show_in_plot = true
color = "yellow"
line_width = 2
line_style = "solid"
yaxis = "y7"
yaxis_range = [0, 100]

[heart]
# The four heart graphs (ECG, Beats, Trends, RMSSD). These are the values the
# page starts from; the steppers on the page override them until a restart.
# Sample rate assumed for an ECG batch that does not carry its own.
fs_hz = 130
# ECG strip width, in multiples of the mean R-R interval (the app's presets are
# 3, 5, 8, 10, 15, 20).
ecg_window_rr = 10
# Trends window, seconds (1 to 60 minutes).
trend_width_s = 600
# Beats drawn in the superposed stack (steps of 1, 2, 4 ... 64).
beats_limit = 64
# RMSSD tile panel: total span in seconds, and tiles per side (2 to 8).
rmssd_width_s = 480
rmssd_side = 4
