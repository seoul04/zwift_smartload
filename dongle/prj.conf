# Bluetooth configuration: central / GATT client only (sensors). Zwift gets the data from
# z_relay_server over the network, so the dongle no longer advertises.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=3

# GATT client MTU and ACL buffers.
# A Polar H10 PMD ECG frame is 229 bytes (10-byte header + 73 x 3-byte samples);
# a Movesense GSP ECG frame is ~72 bytes. The previous ACL RX size of 69 truncated
# the Polar frames to 20 bytes without reporting an error anywhere.
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# RX buffer count is BT_MAX_CONN + BT_BUF_ACL_RX_COUNT_EXTRA in this Zephyr; the
# old CONFIG_BT_BUF_ACL_RX_COUNT symbol no longer exists.
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=3
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_L2CAP_TX_MTU=247

# Link robustness for a marginal-RF sensor.
#
# The Movesense was measured connected at -79 to -87 dBm, and the link was dying
# with HCI reason 0x08 (connection timeout) every few seconds. At -60 dBm the
# same firmware streamed 256 Hz continuously, so the drops are RF, not protocol.
#
# Transmit at the controller's maximum. The default is 0 dBm; the dongle sits in
# a USB port at floor level, so every dB of uplink matters for the ACKs that keep
# the sensor's supervision timer from expiring. +8 dBm is the nRF52840 radio's
# hardware ceiling - there is nothing higher available on this part.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# LE PHY: pinned to 1M.
#
# BT_PHY_UPDATE defaults to y in Zephyr, so BT_AUTO_PHY_UPDATE was initiating the
# PHY update procedure in every build - including the ones that measured well.
# Forcing 2M explicitly made things worse (9.05/s -> 3.04/s at a *better* RSSI of
# -52 dBm, with 240 of 600 seconds producing nothing), so the sensor does not
# cope with running its ECG measurement at 2M.
#
# Disabled outright rather than left at the default: with auto PHY update the
# link could move to 2M at any moment depending on what the peer proposes, which
# makes the stream behaviour depend on something we do not control.
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Logging configuration
CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10

# Serial console: two directions. Outbound is the JSON record stream and the
# {"type":"info"} identity line; inbound is z_relay_server's commands, one JSON
# object per line ({"cmd":"ftms_cp","data":"..."}), read by an RX callback in
# serial_cmd.c. INTERRUPT_DRIVEN is what makes that callback possible.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# REQUIRED for inbound commands to arrive at all: the UDC packet pool must be
# big enough that the RX path can always get a buffer.
#
# The ECG stream writes a record every 8 ms and each record is copied into the
# TX ring buffer, so TX holds UDC buffers continuously. When
# cdc_acm_rx_fifo_handler() cannot allocate one it returns silently -- no log,
# no retry, no timer -- and the OUT endpoint is left un-armed forever. The host
# then sees its writes block and finally time out, which looks exactly like
# "the firmware ignores commands" even though the RX callback is registered and
# the poller runs. Verified on hardware: with CONFIG_UDC_BUF_COUNT=16 (default)
# RX never became ready; silencing the ECG stream made {"cmd":"info"} work.
#
# 64 buffers at USBD_MAX_BULK_MPS (64 B) is 4 KiB of pool for 64 B of packets.
CONFIG_UDC_BUF_COUNT=64
CONFIG_UDC_BUF_POOL_SIZE=4096

# REQUIRED: makes each printk() atomic with respect to preemption, so a JSON
# record cannot be cut in half.
#
# Without it, an ECG record (a header printf, 73 sample printf()s and a trailer,
# all under serial_output_mutex) can be split by another context's output. The
# mutex only orders this project's own callers; the split happens below it, in the
# console layer. Measured at roughly 1 torn record in 600, which breaks the trace
# for every following consumer because the line is no longer valid JSON.
#
# With it: 0 invalid records across 1,097 captured (976 ECG), and the dongle
# streams normally.
#
# Do NOT "fix" the tearing by assembling each record into a buffer and emitting it
# with a single printk(). That was tried and it left the dongle unresponsive after
# boot - LED dark, no BLE advertisements, no console output - while USB stayed
# enumerated. Keeping the separate printf()s and enabling this flag is both
# simpler and the only configuration verified to work.
#
# Default is "y" only on SMP; this board is uniprocessor, so it must be set here.
CONFIG_PRINTK_SYNC=y

# NOTE: CONFIG_ASSERT is deliberately left off. It only turns the GATT API's
# argument checks into __ASSERTs, and with CONFIG_RESET_ON_FATAL_ERROR disabled a
# failing assert halts the device instead of rebooting it, which leaves the dongle
# off the USB bus until it is physically replugged.

# GPIO for button input
CONFIG_GPIO=y

# Memory configuration
CONFIG_HEAP_MEM_POOL_SIZE=2048

# NVS (Non-Volatile Storage) for persistent device memory and grade limits
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# Hardware information (for unique device ID)
CONFIG_HWINFO=y

